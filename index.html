<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>THE EYEBROW スタッフ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#262120">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EB スタッフ">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="staff.css">
</head>
<body class="staff">
<div id="app">
  <header class="top">
    <button class="brand" data-go="notice" aria-label="社内連絡へ">
      <span class="logo">THE EYEBROW</span>
      <span class="shop">Staff</span>
    </button>
    <span class="who" id="who"></span>
  </header>

  <main id="view"><div class="spin"></div></main>

  <nav class="tabs" id="tabs" hidden>
    <button data-go="notice"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg><span>社内連絡</span><i class="badge" id="bNotice" hidden></i></button>
    <button data-go="order"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg><span>備品発注</span><i class="badge" id="bOrder" hidden></i></button>
    <button data-go="slots"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8.5 14.5l2 2 4-4"/></svg><span>空き状況</span></button>
    <button data-go="video"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9v6l5-3z"/></svg><span>研修動画</span><i class="badge" id="bVideo" hidden></i></button>
    <button data-go="shop"><svg viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10M4 10v10h16V10M4 10c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/><path d="M10 20v-4h4v4"/></svg><span>お店</span></button>
  </nav>

  <div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-body" id="sheetBody"></div></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="config.js"></script>
<script src="staff.js"></script>
</body>
</html>
