<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE EYEBROW 京都駅店</title>
<meta name="description" content="THE EYEBROW 京都駅店 公式アプリ。24時間ご予約いただけます。">
<meta name="theme-color" content="#2b2622">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="THE EYEBROW">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" data-go="home">
      <span class="logo">THE EYEBROW</span>
      <span class="shop" id="shopName">京都駅店</span>
    </div>
    <span class="net" id="net" hidden>オフライン</span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
    <button data-go="menu"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg><span>メニュー</span></button>
    <button data-go="book" class="primary"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>予約する</span></button>
    <button data-go="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>マイ予約</span></button>
    <button data-go="shop"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>お店</span></button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
